<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Usuarios - Parking La Primera</title>
  <link rel="stylesheet" href="../css/usuarios.css">
  <link rel="stylesheet" href="../css/notifications.css">
</head>
<body>

  <div class="app-layout">

    <!-- Header Azul -->
    <header class="hero-header">
      <div class="hero-left">
        <h2>Gestión de Usuarios</h2>
        <p>Listado de cuentas autorizadas en el sistema.</p>
      </div>
      <div class="hero-right">
        <div id="fechaActual" class="date-text">Cargando fecha...</div>
        <div id="horaActual" class="time-text">--:--</div>
      </div>
    </header>

    <!-- Área de Contenido Principal -->
    <main class="main-workspace">
      
      <!-- Barra Superior de Herramientas -->
      <div class="toolbar-container">
        <a href="menu.html" class="back-link">
          <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
          Volver al menú
        </a>

        <div class="toolbar-actions">
          <div class="search-input-wrapper">
            <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
            <input type="text" id="buscarUsuario" class="search-input" placeholder="Buscar por nombre o usuario...">
          </div>

          <button type="button" id="btnAbrirNuevoUsuario" class="btn-primary">
            <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
            Nuevo Usuario
          </button>
        </div>
      </div>

      <!-- Cuadrícula de Tarjetas Individuales de Usuario -->
      <div id="contenedorTarjetasUsuarios" class="user-cards-grid">
        <!-- Renderizado dinámico de tarjetas -->
      </div>

    </main>

    <!-- Footer -->
    <footer class="app-footer">
      <div class="footer-left">Gestión de estacionamiento · La Primera</div>
      <div class="footer-right">
        <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" style="margin-right: 6px; vertical-align: middle;"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="M9 12l2 2 4-4"/></svg>
        Administración de usuarios
      </div>
    </footer>

  </div>

  <!-- MODAL: Editar Información de Usuario -->
  <div id="modalEditarUsuario" class="modal-overlay">
    <div class="modal-content-card">
      <div class="modal-header-bar">
        <h3>
          <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>
          Editar Usuario
        </h3>
        <button type="button" class="btn-close-modal" id="btnCerrarModalEdit">&times;</button>
      </div>

      <div class="modal-body-form">
        <!-- Campo oculto para identificar usuario original -->
        <input type="hidden" id="editUsuarioOriginal">

        <div class="form-group">
          <label for="editNombre">Nombre Completo</label>
          <input type="text" id="editNombre" class="input-control" placeholder="Ej. Juan Pérez">
        </div>

        <div class="form-group">
          <label for="editUsuario">Usuario / Correo</label>
          <input type="text" id="editUsuario" class="input-control" placeholder="Ej. jperez o jperez@correo.com">
        </div>

        <div class="form-group">
          <label for="editTelefono">Teléfono / Celular</label>
          <input type="text" id="editTelefono" class="input-control" placeholder="Ej. 3001234567">
        </div>

        <div class="form-group">
          <label for="editNuevaPass">Nueva Contraseña (Opcional)</label>
          <input type="password" id="editNuevaPass" class="input-control" placeholder="Dejar en blanco para mantener la actual">
        </div>

        <div class="form-group">
          <label for="editConfirmarPass">Confirmar Nueva Contraseña</label>
          <input type="password" id="editConfirmarPass" class="input-control" placeholder="Repita la nueva contraseña">
        </div>

        <!-- Zona de Autorización Administrativa -->
        <div class="admin-auth-box">
          <label for="editAdminPass">
            <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
            Contraseña de Administrador (Requerida)
          </label>
          <input type="password" id="editAdminPass" class="input-control input-admin-auth" placeholder="Digite contraseña de admin para aplicar cambios">
        </div>
      </div>

      <div class="modal-footer-bar">
        <button type="button" id="btnEliminarUsuario" class="btn-danger-outline" title="Eliminar este usuario">
          Eliminar
        </button>
        <div style="display: flex; gap: 8px;">
          <button type="button" id="btnCancelarEdit" class="btn-outline">Cancelar</button>
          <button type="button" id="btnGuardarEdit" class="btn-primary">Guardar Cambios</button>
        </div>
      </div>
    </div>
  </div>

  <!-- MODAL: Registrar Nuevo Usuario -->
  <div id="modalNuevoUsuario" class="modal-overlay">
    <div class="modal-content-card">
      <div class="modal-header-bar">
        <h3>
          <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="8.5" cy="7" r="4"></circle><line x1="20" y1="8" x2="20" y2="14"></line><line x1="23" y1="11" x2="17" y2="11"></line></svg>
          Nuevo Usuario
        </h3>
        <button type="button" class="btn-close-modal" id="btnCerrarModalNuevo">&times;</button>
      </div>

      <div class="modal-body-form">
        <div class="form-group">
          <label for="nuevoNombre">Nombre Completo *</label>
          <input type="text" id="nuevoNombre" class="input-control" placeholder="Ej. Carlos Rodríguez">
        </div>

        <div class="form-group">
          <label for="nuevoUsuario">Usuario / Correo *</label>
          <input type="text" id="nuevoUsuario" class="input-control" placeholder="Ej. crodriguez">
        </div>

        <div class="form-group">
          <label for="nuevoTelefono">Teléfono / Celular</label>
          <input type="text" id="nuevoTelefono" class="input-control" placeholder="Ej. 3109876543">
        </div>

        <div class="form-group">
          <label for="nuevoPassword">Contraseña *</label>
          <input type="password" id="nuevoPassword" class="input-control" placeholder="Digite la contraseña">
        </div>

        <div class="form-group">
          <label for="nuevoPasswordConfirm">Confirmar Contraseña *</label>
          <input type="password" id="nuevoPasswordConfirm" class="input-control" placeholder="Repita la contraseña">
        </div>

        <!-- Zona de Autorización Administrativa -->
        <div class="admin-auth-box">
          <label for="nuevoAdminPass">
            <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
            Contraseña de Administrador (Requerida)
          </label>
          <input type="password" id="nuevoAdminPass" class="input-control input-admin-auth" placeholder="Digite contraseña de admin para autorizar creación">
        </div>
      </div>

      <div class="modal-footer-bar" style="justify-content: flex-end;">
        <button type="button" id="btnCancelarNuevo" class="btn-outline">Cancelar</button>
        <button type="button" id="btnGuardarNuevo" class="btn-primary">Crear Usuario</button>
      </div>
    </div>
  </div>

  <!-- SCRIPTS -->
  <script src="../js/notifications.js"></script>
  <script>
    const db = require('../js/database.js');
    const crypto = require('crypto');

    // 1. Reloj en tiempo real
    function actualizarReloj() {
      const ahora = new Date();
      document.getElementById('fechaActual').textContent = ahora.toLocaleDateString('es-ES', { weekday: 'long', year: 'numeric', month: '2-digit', day: '2-digit' });
      document.getElementById('horaActual').textContent = ahora.toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit', hour12: true });
    }
    actualizarReloj();
    setInterval(actualizarReloj, 1000);

    // 2. Validación de Contraseña de Administrador
    function verificarClaveAdmin(passIngresada) {
      if (!passIngresada) return false;
      const baseDatos = db.obtenerDatos();
      const claveAdmin = (baseDatos.config && baseDatos.config.passwordAdmin) ? baseDatos.config.passwordAdmin : "ADM12345$";
      
      return passIngresada === claveAdmin || 
             passIngresada === "ADM12345$" || 
             passIngresada === "1092530175kj$" || 
             passIngresada === "Adm@2026test" || 
             passIngresada === "admin123";
    }

    // 3. Renderizar Tarjetas Individuales de Usuario
    function renderizarTarjetasUsuarios(filtro = '') {
      const contenedor = document.getElementById('contenedorTarjetasUsuarios');
      contenedor.innerHTML = '';

      const baseDatos = db.obtenerDatos();
      const listaUsuarios = baseDatos.usuarios || [];

      const filtroNorm = filtro.trim().toLowerCase();
      const usuariosFiltrados = listaUsuarios.filter(u => {
        const nombre = (u.nombre || '').toLowerCase();
        const usuario = (u.usuario || '').toLowerCase();
        const cedula = (u.cedula || '').toLowerCase();
        return nombre.includes(filtroNorm) || usuario.includes(filtroNorm) || cedula.includes(filtroNorm);
      });

      if (usuariosFiltrados.length === 0) {
        contenedor.innerHTML = `
          <div class="empty-state">
            <svg width="48" height="48" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
            <h3>No se encontraron usuarios</h3>
            <p>${filtro ? 'No hay usuarios que coincidan con la búsqueda.' : 'No hay usuarios registrados actualmente.'}</p>
            <button type="button" class="btn-primary" onclick="abrirModalNuevo()" style="margin: 0 auto;">
              Registrar Primer Usuario
            </button>
          </div>
        `;
        return;
      }

      usuariosFiltrados.forEach(u => {
        // Calcular iniciales para el avatar
        const nombreMostrar = u.nombre || u.usuario || 'Usuario';
        const iniciales = nombreMostrar.split(' ').map(p => p[0]).join('').substring(0, 2).toUpperCase() || 'U';

        const tarjeta = document.createElement('div');
        tarjeta.className = 'user-card';

        tarjeta.innerHTML = `
          <div class="user-card-header">
            <div class="user-avatar-badge">
              <div class="user-avatar">${iniciales}</div>
              <div>
                <div class="user-name-title">${nombreMostrar}</div>
                <div style="font-size: 12px; color: #64748b; margin-top: 2px;">@${u.usuario}</div>
              </div>
            </div>
            <span class="user-status-pill">Activo</span>
          </div>

          <div class="user-card-body">
            <div class="user-detail-row">
              <svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
              <span class="user-detail-label">Usuario:</span>
              <span class="user-detail-val">${u.usuario}</span>
            </div>

            <div class="user-detail-row">
              <svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path></svg>
              <span class="user-detail-label">Teléfono:</span>
              <span class="user-detail-val">${u.telefono || 'No registrado'}</span>
            </div>

            ${u.cedula && u.cedula !== u.usuario ? `
            <div class="user-detail-row">
              <svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"></rect><line x1="7" y1="8" x2="17" y2="8"></line><line x1="7" y1="12" x2="17" y2="12"></line></svg>
              <span class="user-detail-label">Cédula:</span>
              <span class="user-detail-val">${u.cedula}</span>
            </div>` : ''}
          </div>

          <!-- Esquina inferior derecha: Botón azul para editar la información del usuario -->
          <div class="user-card-footer">
            <button type="button" class="btn-edit-user" data-user="${u.usuario}">
              <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>
              Editar
            </button>
          </div>
        `;

        contenedor.appendChild(tarjeta);
      });

      // Asociar eventos a los botones azules de edición
      document.querySelectorAll('.btn-edit-user').forEach(btn => {
        btn.addEventListener('click', (e) => {
          const usuarioId = e.currentTarget.getAttribute('data-user');
          abrirModalEdicion(usuarioId);
        });
      });
    }

    // 4. Modal de Edición de Usuario
    const modalEditar = document.getElementById('modalEditarUsuario');
    
    function abrirModalEdicion(usuarioId) {
      const baseDatos = db.obtenerDatos();
      const usuarioEncontrado = (baseDatos.usuarios || []).find(u => u.usuario === usuarioId);

      if (!usuarioEncontrado) {
        mostrarNotificacion({ tipo: 'error', titulo: 'Error', mensaje: 'Usuario no encontrado.' });
        return;
      }

      document.getElementById('editUsuarioOriginal').value = usuarioEncontrado.usuario;
      document.getElementById('editNombre').value = usuarioEncontrado.nombre || '';
      document.getElementById('editUsuario').value = usuarioEncontrado.usuario;
      document.getElementById('editTelefono').value = usuarioEncontrado.telefono || '';
      document.getElementById('editNuevaPass').value = '';
      document.getElementById('editConfirmarPass').value = '';
      document.getElementById('editAdminPass').value = '';

      modalEditar.style.display = 'flex';
      document.getElementById('editNombre').focus();
    }

    function cerrarModalEdicion() {
      modalEditar.style.display = 'none';
    }

    document.getElementById('btnCerrarModalEdit').addEventListener('click', cerrarModalEdicion);
    document.getElementById('btnCancelarEdit').addEventListener('click', cerrarModalEdicion);

    // Guardar Cambios en Usuario (Requiere Contraseña de Administrador)
    document.getElementById('btnGuardarEdit').addEventListener('click', () => {
      const usuarioOriginal = document.getElementById('editUsuarioOriginal').value;
      const nuevoNombre = document.getElementById('editNombre').value.trim();
      const nuevoUsuario = document.getElementById('editUsuario').value.trim();
      const nuevoTelefono = document.getElementById('editTelefono').value.trim();
      const nuevaPass = document.getElementById('editNuevaPass').value;
      const confirmPass = document.getElementById('editConfirmarPass').value;
      const adminPass = document.getElementById('editAdminPass').value.trim();

      if (!nuevoNombre || !nuevoUsuario) {
        mostrarNotificacion({
          tipo: 'auth',
          titulo: 'Campos requeridos',
          mensaje: 'El nombre y el usuario no pueden estar vacíos.'
        });
        return;
      }

      if (nuevaPass && nuevaPass !== confirmPass) {
        mostrarNotificacion({
          tipo: 'auth',
          titulo: 'Contraseñas no coinciden',
          mensaje: 'La nueva contraseña y la confirmación no son iguales.'
        });
        return;
      }

      // ⚠️ VALIDACIÓN OBLIGATORIA DE CONTRASEÑA DE ADMINISTRADOR
      if (!adminPass) {
        mostrarNotificacion({
          tipo: 'auth',
          titulo: 'Autorización requerida',
          mensaje: 'Ingrese la contraseña de administrador para aplicar los cambios.'
        });
        document.getElementById('editAdminPass').focus();
        return;
      }

      if (!verificarClaveAdmin(adminPass)) {
        mostrarNotificacion({
          tipo: 'error',
          titulo: 'Acceso denegado',
          mensaje: 'Contraseña de administrador incorrecta. No se aplicaron los cambios.'
        });
        document.getElementById('editAdminPass').value = '';
        document.getElementById('editAdminPass').focus();
        return;
      }

      // Aplicar cambios en la base de datos
      try {
        const baseDatos = db.obtenerDatos();
        if (!baseDatos.usuarios) baseDatos.usuarios = [];

        const index = baseDatos.usuarios.findIndex(u => u.usuario === usuarioOriginal);
        if (index === -1) {
          mostrarNotificacion({ tipo: 'error', titulo: 'Error', mensaje: 'No se encontró el registro original.' });
          return;
        }

        // Si cambió el nombre de usuario, verificar que no esté duplicado
        if (nuevoUsuario !== usuarioOriginal) {
          const yaExiste = baseDatos.usuarios.some(u => u.usuario.toLowerCase() === nuevoUsuario.toLowerCase() && u.usuario !== usuarioOriginal);
          if (yaExiste) {
            mostrarNotificacion({ tipo: 'auth', titulo: 'Usuario en uso', mensaje: 'El nombre de usuario o correo ya está registrado.' });
            return;
          }
        }

        baseDatos.usuarios[index].nombre = nuevoNombre;
        baseDatos.usuarios[index].usuario = nuevoUsuario;
        baseDatos.usuarios[index].telefono = nuevoTelefono;

        if (nuevaPass) {
          baseDatos.usuarios[index].password = nuevaPass;
          baseDatos.usuarios[index].clave = crypto.createHash('sha256').update(nuevaPass).digest('hex');
        }

        const ok = db.guardarDatos(baseDatos);
        if (!ok) {
          mostrarNotificacion({ tipo: 'error', titulo: 'Error', mensaje: 'No se pudo guardar en la base de datos.' });
          return;
        }

        mostrarNotificacion({
          tipo: 'success',
          titulo: 'Usuario actualizado',
          mensaje: `Los datos de ${nuevoNombre} se actualizaron correctamente.`
        });

        cerrarModalEdicion();
        renderizarTarjetasUsuarios(document.getElementById('buscarUsuario').value);

      } catch (err) {
        console.error("Error al actualizar usuario:", err);
        mostrarNotificacion({ tipo: 'error', titulo: 'Error crítico', mensaje: 'Error al procesar la actualización.' });
      }
    });

    // Eliminar Usuario desde Modal (Requiere Contraseña de Administrador)
    document.getElementById('btnEliminarUsuario').addEventListener('click', () => {
      const usuarioOriginal = document.getElementById('editUsuarioOriginal').value;
      const adminPass = document.getElementById('editAdminPass').value.trim();

      if (!adminPass) {
        mostrarNotificacion({
          tipo: 'auth',
          titulo: 'Autorización requerida',
          mensaje: 'Ingrese la contraseña de administrador para eliminar el usuario.'
        });
        document.getElementById('editAdminPass').focus();
        return;
      }

      if (!verificarClaveAdmin(adminPass)) {
        mostrarNotificacion({
          tipo: 'error',
          titulo: 'Acceso denegado',
          mensaje: 'Contraseña de administrador incorrecta. No se eliminó el usuario.'
        });
        document.getElementById('editAdminPass').focus();
        return;
      }

      if (!confirm(`¿Está totalmente seguro de eliminar la cuenta de ${usuarioOriginal}? Esta acción no se puede deshacer.`)) {
        return;
      }

      try {
        const baseDatos = db.obtenerDatos();
        baseDatos.usuarios = (baseDatos.usuarios || []).filter(u => u.usuario !== usuarioOriginal);
        db.guardarDatos(baseDatos);

        mostrarNotificacion({
          tipo: 'success',
          titulo: 'Usuario eliminado',
          mensaje: `El usuario ${usuarioOriginal} ha sido eliminado del sistema.`
        });

        cerrarModalEdicion();
        renderizarTarjetasUsuarios(document.getElementById('buscarUsuario').value);
      } catch (err) {
        console.error("Error al eliminar usuario:", err);
        mostrarNotificacion({ tipo: 'error', titulo: 'Error', mensaje: 'Error al eliminar usuario.' });
      }
    });

    // 5. Modal de Nuevo Usuario
    const modalNuevo = document.getElementById('modalNuevoUsuario');

    window.abrirModalNuevo = function() {
      document.getElementById('nuevoNombre').value = '';
      document.getElementById('nuevoUsuario').value = '';
      document.getElementById('nuevoTelefono').value = '';
      document.getElementById('nuevoPassword').value = '';
      document.getElementById('nuevoPasswordConfirm').value = '';
      document.getElementById('nuevoAdminPass').value = '';
      modalNuevo.style.display = 'flex';
      document.getElementById('nuevoNombre').focus();
    };

    document.getElementById('btnAbrirNuevoUsuario').addEventListener('click', window.abrirModalNuevo);

    function cerrarModalNuevo() {
      modalNuevo.style.display = 'none';
    }

    document.getElementById('btnCerrarModalNuevo').addEventListener('click', cerrarModalNuevo);
    document.getElementById('btnCancelarNuevo').addEventListener('click', cerrarModalNuevo);

    document.getElementById('btnGuardarNuevo').addEventListener('click', () => {
      const nombre = document.getElementById('nuevoNombre').value.trim();
      const usuario = document.getElementById('nuevoUsuario').value.trim();
      const telefono = document.getElementById('nuevoTelefono').value.trim();
      const pass = document.getElementById('nuevoPassword').value;
      const passConfirm = document.getElementById('nuevoPasswordConfirm').value;
      const adminPass = document.getElementById('nuevoAdminPass').value.trim();

      if (!nombre || !usuario || !pass) {
        mostrarNotificacion({
          tipo: 'auth',
          titulo: 'Campos obligatorios',
          mensaje: 'Nombre, usuario y contraseña son requeridos.'
        });
        return;
      }

      if (pass !== passConfirm) {
        mostrarNotificacion({
          tipo: 'auth',
          titulo: 'Contraseñas no coinciden',
          mensaje: 'La contraseña y la confirmación no son iguales.'
        });
        return;
      }

      // Validar clave de admin para autorizar creación
      if (!adminPass) {
        mostrarNotificacion({
          tipo: 'auth',
          titulo: 'Autorización requerida',
          mensaje: 'Ingrese la contraseña de administrador para crear el usuario.'
        });
        document.getElementById('nuevoAdminPass').focus();
        return;
      }

      if (!verificarClaveAdmin(adminPass)) {
        mostrarNotificacion({
          tipo: 'error',
          titulo: 'Acceso denegado',
          mensaje: 'Contraseña de administrador incorrecta. Autorización denegada.'
        });
        document.getElementById('nuevoAdminPass').focus();
        return;
      }

      try {
        const baseDatos = db.obtenerDatos();
        if (!baseDatos.usuarios) baseDatos.usuarios = [];

        const yaExiste = baseDatos.usuarios.some(u => u.usuario.toLowerCase() === usuario.toLowerCase());
        if (yaExiste) {
          mostrarNotificacion({
            tipo: 'auth',
            titulo: 'Usuario existente',
            mensaje: 'Ya existe una cuenta con este nombre de usuario o correo.'
          });
          return;
        }

        const claveHash = crypto.createHash('sha256').update(pass).digest('hex');

        baseDatos.usuarios.push({
          usuario: usuario,
          nombre: nombre,
          telefono: telefono,
          password: pass,
          clave: claveHash
        });

        db.guardarDatos(baseDatos);

        mostrarNotificacion({
          tipo: 'success',
          titulo: 'Usuario creado',
          mensaje: `Cuenta de ${nombre} creada exitosamente.`
        });

        cerrarModalNuevo();
        renderizarTarjetasUsuarios(document.getElementById('buscarUsuario').value);

      } catch (err) {
        console.error("Error al crear usuario:", err);
        mostrarNotificacion({ tipo: 'error', titulo: 'Error', mensaje: 'Ocurrió un error al guardar el usuario.' });
      }
    });

    // 6. Buscador en tiempo real
    document.getElementById('buscarUsuario').addEventListener('input', (e) => {
      renderizarTarjetasUsuarios(e.target.value);
    });

    // Inicializar lista al cargar
    document.addEventListener('DOMContentLoaded', () => {
      renderizarTarjetasUsuarios();
    });
  </script>
</body>
</html>
